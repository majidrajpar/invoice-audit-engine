[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-audit-engine"
version = "1.0.0"
description = "Air-gapped 100% population continuous controls monitoring and invoice audit telemetry engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Majid Mumtaz"}
]
keywords = ["internal-audit", "continuous-controls-monitoring", "ocr", "invoice-processing", "fraud-detection", "procurement-audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "rapidocr-onnxruntime>=1.2.3",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.5.0",
    "openpyxl>=3.1.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "pypdfium2>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pymupdf>=1.23.0",
]

[project.scripts]
invoice-audit = "invoice_audit_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
